name: Apply v4.8.1 release patch

on:
  push:
    branches:
      - fix/v481-active-search
    paths:
      - tmp/v481-release.patch.gz.b64
      - .github/workflows/v481-apply-release-patch.yml

permissions:
  contents: write

jobs:
  apply-release-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v481-active-search
          fetch-depth: 0

      - name: Decode and verify exact patch
        run: |
          base64 -d tmp/v481-release.patch.gz.b64 > /tmp/v481-release.patch.gz
          gzip -dc /tmp/v481-release.patch.gz > /tmp/v481-release.patch
          echo "f390613476292fe6a767153eec8986e59c8d3381da61f64fa2ef1fb9de6199c7  /tmp/v481-release.patch" | sha256sum -c -
          git apply --check /tmp/v481-release.patch
          git apply /tmp/v481-release.patch
          rm tmp/v481-release.patch.gz.b64
          rm .github/workflows/v481-apply-release-patch.yml

      - name: Commit exact v4.8.1 release preparation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "release: prepare Recruitment Agency 4.8.1"
          git push origin HEAD:fix/v481-active-search

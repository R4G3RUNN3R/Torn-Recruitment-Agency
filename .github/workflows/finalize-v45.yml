name: finalize-v45

on:
  push:
    branches: [feature/v4.5-forum-discovery]
    paths:
      - scripts/finalize-v45.js
      - scripts/finalize-v45-tests.js
      - scripts/finalize-v45-syntax.js
      - .github/workflows/finalize-v45.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.5-forum-discovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Finalize v4.5 source
        run: |
          node scripts/finalize-v45.js
          node scripts/finalize-v45-tests.js
          node scripts/finalize-v45-syntax.js
      - name: Verify finalized source
        run: |
          npm run syntax
          npm test
      - name: Commit finalized v4.5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize v4.5 application" || exit 0
          git push origin HEAD:feature/v4.5-forum-discovery

name: apply-v43-gm-transport

on:
  workflow_dispatch:
  push:
    branches: [feature/v4.3-global-intelligence]
    paths:
      - scripts/apply-v43-gm-transport.js
      - .github/workflows/v43-gm-transport.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.3-global-intelligence
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply transport patch
        run: node scripts/apply-v43-gm-transport.js
      - name: Run unit tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run syntax
      - name: Commit generated transport patch
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R4G3RUNN3R-Recruitment-Agency.user.js
          git commit -m "fix: use cross-origin transport for global intelligence"
          git push origin HEAD:feature/v4.3-global-intelligence

name: v4.7 waiver patch

on:
  push:
    branches:
      - feature/v4.7-faction-recruitment
    paths:
      - scripts/patch-v47-waiver-ui.js
      - .github/workflows/v47-waiver-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.7-faction-recruitment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply guarded waiver patch
        run: node scripts/patch-v47-waiver-ui.js
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v47-faction-ui.js src/v47-faction-platform.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add faction waiver management UI"
          git push origin HEAD:feature/v4.7-faction-recruitment

name: v4.7 waiver patch

on:
  push:
    branches:
      - feature/v4.7-faction-recruitment
    paths:
      - scripts/patch-v47-waiver-ui.js
      - .github/workflows/v47-waiver-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.7-faction-recruitment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Apply guarded waiver patch
        run: node scripts/patch-v47-waiver-ui.js
      - name: Run tests and capture output
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/v47-waiver-tests.log
      - name: Persist focused failure diagnostics
        if: steps.tests.outcome == 'failure'
        shell: bash
        run: |
          tail -n 220 /tmp/v47-waiver-tests.log > scripts/v47-waiver-test-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/v47-waiver-test-failure.txt
          git commit -m "chore: capture v4.7 waiver test failure"
          git push origin HEAD:feature/v4.7-faction-recruitment
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v47-faction-ui.js src/v47-faction-platform.js
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: add faction waiver management UI"
          git push origin HEAD:feature/v4.7-faction-recruitment

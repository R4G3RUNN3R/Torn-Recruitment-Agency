name: remote-edit

on:
  push:
    branches: [feature/v4.4-smart-match]
    paths:
      - tools/remote-edit-trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic source edits
        run: node tools/remote-edit.js
      - name: Verify patched JavaScript
        run: |
          git diff --check
          node --check src/match-core.js
          node --check R4G3RUNN3R-Recruitment-Agency.user.js
          node --check tests/userscript-static.test.js
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/match-core.js R4G3RUNN3R-Recruitment-Agency.user.js tests/userscript-static.test.js
          git commit -m "test: harden Settings and help static checks"
          git push origin HEAD:${{ github.ref_name }}

name: v461-hotfix-patch

on:
  push:
    branches: [hotfix/v4.6.1-runtime-pin]
    paths:
      - '.github/workflows/v461-hotfix-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v4.6.1-runtime-pin
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create immutable v4.6.1 runtime source commit
        run: |
          node scripts/patch-v461-hotfix.js source
          git add src/v45-app.js
          git commit -m "fix: publish v4.6.1 runtime version"
      - name: Build public v4.6.1 installer against immutable source
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "Immutable runtime source: ${SOURCE_SHA}"
          node scripts/patch-v461-hotfix.js release "${SOURCE_SHA}"
          git add R4G3RUNN3R-Recruitment-Agency.user.js package.json tests/userscript-static.test.js
          git commit -m "fix: release v4.6.1 with Tampermonkey update recovery"
      - name: Push hotfix commits
        run: git push origin HEAD:hotfix/v4.6.1-runtime-pin

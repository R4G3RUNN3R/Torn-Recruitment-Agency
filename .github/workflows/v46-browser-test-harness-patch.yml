name: v46 browser harness patch

on:
  push:
    branches:
      - feature/v4.6-company-recruitment

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-v46-browser-harness-patch]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-company-recruitment
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch source browser harnesses
        run: node scripts/patch-v46-browser-test-harnesses.js
      - name: Commit harness updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --exit-code && exit 1 || true
          git commit -m "test(v4.6): load Company platform in source browser harnesses"
          git push origin HEAD:feature/v4.6-company-recruitment

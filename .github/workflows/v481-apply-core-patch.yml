name: Apply v4.8.1 core patch

on:
  push:
    branches:
      - fix/v481-active-search
    paths:
      - tmp/v481-app.patch
      - .github/workflows/v481-apply-core-patch.yml

permissions:
  contents: write

jobs:
  apply-core-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v481-active-search
          fetch-depth: 0

      - name: Apply verified patch
        run: |
          git apply --check tmp/v481-app.patch
          git apply tmp/v481-app.patch
          rm tmp/v481-app.patch
          rm .github/workflows/v481-apply-core-patch.yml

      - name: Commit exact patched core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: wire active search into core runtime"
          git push origin HEAD:fix/v481-active-search

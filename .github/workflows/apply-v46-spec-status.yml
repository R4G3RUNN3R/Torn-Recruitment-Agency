name: correct v4.6 spec status

on:
  push:
    branches: [feature/v4.6-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-v46-spec-status]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-foundation
          fetch-depth: 0
      - name: Correct approved spec status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/superpowers/specs/2026-08-24-v4.6-recruitment-platform-architecture-design.md')
          text = p.read_text()
          old = '**Status:** Approved architecture; written-spec review pending  '
          new = '**Status:** Approved  '
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale status line, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          git diff --check
      - name: Commit status correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/superpowers/specs/2026-08-24-v4.6-recruitment-platform-architecture-design.md
          git commit -m "docs: mark v4.6 architecture spec approved"
          git push origin HEAD:feature/v4.6-foundation

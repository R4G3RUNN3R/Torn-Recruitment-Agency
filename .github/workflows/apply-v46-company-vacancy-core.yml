name: apply v4.6 company vacancy core
on:
  push:
    branches: [feature/v4.6-company-core]
permissions:
  contents: write
jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-company-vacancy-core]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-company-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded Company vacancy core patch
        run: |
          node --check scripts/apply-v46-company-vacancy-core.js
          node scripts/apply-v46-company-vacancy-core.js
          git diff --check
      - name: Commit Company vacancy core integration
        run: |
          if git diff --quiet; then echo "Guarded patch produced no changes" >&2; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js
          git commit -m "feat: add versioned Company baseline and vacancy core"
          git push origin HEAD:feature/v4.6-company-core

name: v4.7.4 stale-owner verification

on:
  push:
    branches: [hotfix/v4.7.4-bootstrap-takeover]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run syntax

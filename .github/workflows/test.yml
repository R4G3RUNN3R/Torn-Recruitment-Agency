name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  patch-company-ui:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/v4.6-company-recruitment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply guarded Company UI integration
        shell: python
        run: |
          from pathlib import Path

          app=Path('src/v45-app.js')
          text=app.read_text()
          if 'V46CompanyUI: root && root.RA_V46CompanyUI' in text:
              Path('/tmp/noop').write_text('already integrated')
              raise SystemExit(0)

          replacements=[
            ("    V46CompanyCore: root && root.RA_V46CompanyCore,\n    V46CompanyStorage: root && root.RA_V46CompanyStorage\n","    V46CompanyCore: root && root.RA_V46CompanyCore,\n    V46CompanyStorage: root && root.RA_V46CompanyStorage,\n    V46CompanyUI: root && root.RA_V46CompanyUI\n"),
            ("    deps.V46CompanyCore = require('./v46-company-core');\n    deps.V46CompanyStorage = require('./v46-company-storage');\n","    deps.V46CompanyCore = require('./v46-company-core');\n    deps.V46CompanyStorage = require('./v46-company-storage');\n    deps.V46CompanyUI = require('./v46-company-ui');\n"),
            ("const {ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage} = D;","const {ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage,V46CompanyUI} = D;"),
            ("if (![ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage].every(Boolean)) {","if (![ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage,V46CompanyUI].every(Boolean)) {")
          ]
          for old,new in replacements:
              if text.count(old)!=1: raise SystemExit(f'app dependency marker mismatch: {old[:100]!r}')
              text=text.replace(old,new,1)

          marker="  async function renderData(){const candidates=await idb.getAll('candidateLocal'),sources=await idb.getAll('forumSources'),logs=await idb.getAll('appLogs');"
          if text.count(marker)!=1: raise SystemExit('renderData marker mismatch')
          company_funcs="""  async function companyWorkflowRows(){
    const [companyRecords,players,config]=await Promise.all([idb.getAll('companyRecruitment'),idb.getAll('playerIntelligence'),companyRepositories.config.get()]);
    const baseline=V46CompanyCore.normalizeBaseline(config.baseline||{});
    return V46CompanyUI.buildCandidateRows(companyRecords,players,{eligibilityFor:(record,player)=>V46CompanyCore.evaluateCriteria(baseline.criteria,player,record.waivers||[])});
  }
  async function renderCompanyOverview(){const [rows,vacancies]=await Promise.all([companyWorkflowRows(),companyRepositories.vacancies.list()]);return V46CompanyUI.renderOverview(V46CompanyUI.buildOverviewModel(rows,vacancies));}
  async function renderCompanyToday(){const [rows,config]=await Promise.all([companyWorkflowRows(),companyRepositories.config.get()]);return V46CompanyUI.renderToday(V46CompanyUI.buildTodayModel(rows,{now:Date.now(),stageThresholds:config.stageThresholds,opportunities:{}}));}
  async function renderCompanyCandidates(){return V46CompanyUI.renderCandidates(await companyWorkflowRows());}
  async function renderCompanyPipeline(){return V46CompanyUI.renderPipeline(V46CompanyUI.buildPipelineModel(await companyWorkflowRows()));}

"""
          text=text.replace(marker,company_funcs+marker,1)
          old="const renderers={'company-overview':renderOverview,'company-discover':renderDiscover,'company-candidates':renderCandidates,'company-pipeline':renderPipeline,'company-today':renderCompanyPlaceholder,"
          new="const renderers={'company-overview':renderCompanyOverview,'company-discover':renderDiscover,'company-candidates':renderCompanyCandidates,'company-pipeline':renderCompanyPipeline,'company-today':renderCompanyToday,"
          if text.count(old)!=1: raise SystemExit('renderer marker mismatch')
          text=text.replace(old,new,1)
          old="return Object.freeze({SCRIPT_VERSION,DB_VERSION,HARD_API_RATE,MIN_API_GAP_MS,DEFAULT_VISIBLE_COLUMNS,OPTIONAL_COLUMNS,openDB,mergeSettings,start,_test:{state,repositories,companyRepositories,recruitmentDomainForFeed,persistDiscoveredCandidate,deleteCompanyCandidateData,clearRecruitmentData,applyCandidateFilters,candidateCsvRow,matchAvailability,forumThreadUrl}});"
          new="return Object.freeze({SCRIPT_VERSION,DB_VERSION,HARD_API_RATE,MIN_API_GAP_MS,DEFAULT_VISIBLE_COLUMNS,OPTIONAL_COLUMNS,openDB,mergeSettings,start,_test:{state,repositories,companyRepositories,companyWorkflowRows,recruitmentDomainForFeed,persistDiscoveredCandidate,deleteCompanyCandidateData,clearRecruitmentData,applyCandidateFilters,candidateCsvRow,matchAvailability,forumThreadUrl}});"
          if text.count(old)!=1: raise SystemExit('export marker mismatch')
          app.write_text(text.replace(old,new,1))

          for p in Path('tests').glob('*.test.js'):
              content=p.read_text()
              old="'v46-company-storage.js','v45-app.js'"
              if old in content:p.write_text(content.replace(old,"'v46-company-storage.js','v46-company-ui.js','v45-app.js'"))

          Path('tests/v46-company-ui-static.test.js').write_text("""const test=require('node:test');
const assert=require('node:assert/strict');
const fs=require('node:fs');
const path=require('node:path');
const app=fs.readFileSync(path.join(__dirname,'..','src','v45-app.js'),'utf8');
test('Company UI powers the four implemented Company routes',()=>{assert.match(app,/V46CompanyUI:\\s*root\\s*&&\\s*root\\.RA_V46CompanyUI/);assert.match(app,/'company-overview':renderCompanyOverview/);assert.match(app,/'company-today':renderCompanyToday/);assert.match(app,/'company-candidates':renderCompanyCandidates/);assert.match(app,/'company-pipeline':renderCompanyPipeline/);});
test('Company workflow rows never read Faction workflow state',()=>{const start=app.indexOf('async function companyWorkflowRows()');const end=app.indexOf('async function renderCompanyOverview()',start);assert.ok(start>=0&&end>start);const body=app.slice(start,end);assert.match(body,/idb\\.getAll\\('companyRecruitment'\\)/);assert.match(body,/idb\\.getAll\\('playerIntelligence'\\)/);assert.doesNotMatch(body,/factionRecruitment/);assert.match(body,/V46CompanyCore\\.evaluateCriteria/);});
""")
      - name: Commit integration if needed
        run: |
          if [ -f /tmp/noop ]; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v45-app.js tests
          git diff --cached --check
          git commit -m "feat: power Company workflow pages from separated domain data"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit and runtime smoke tests
        run: npm test
      - name: Check JavaScript syntax
        run: npm run syntax

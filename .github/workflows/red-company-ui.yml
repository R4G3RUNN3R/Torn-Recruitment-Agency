name: red-company-ui
on:
  push:
    branches: [feature/v4.6-company-recruitment]
    paths: ['.github/workflows/red-company-ui.yml']
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-company-recruitment
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --test tests/v46-company-ui.test.js

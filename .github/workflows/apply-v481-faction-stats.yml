name: apply v481 faction stat preservation

on:
  push:
    branches:
      - fix/v481-active-search
    paths:
      - .github/workflows/apply-v481-faction-stats.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v481-active-search
          fetch-depth: 0
      - name: Apply reviewed fix
        run: |
          python3 .github/scripts/apply-v481-faction-fix.py
          node --check src/v45-app.js
          npm install --ignore-scripts --no-audit --no-fund
          node --test --test-concurrency=1 tests/v481-active-search.test.js
          git diff --check
          git rm .github/workflows/apply-v481-faction-stats.yml .github/scripts/apply-v481-faction-fix.py
          git config user.name 'Voidsmith Release Automation'
          git config user.email 'release@voidsmithindustries.com'
          git add src/v45-app.js tests/v481-active-search.test.js
          git commit -m 'fix: preserve faction stats across forum history'
          git push origin HEAD:fix/v481-active-search

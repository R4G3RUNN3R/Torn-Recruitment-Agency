name: apply-v476-recruit-private-chat

on:
  push:
    branches: [feature/recruit-private-chat]
    paths:
      - 'scripts/apply-v476-recruit-private-chat.mjs'
      - '.github/workflows/v476-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recruit-private-chat
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize temporary patch-script escapes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/apply-v476-recruit-private-chat.mjs';
          let s = fs.readFileSync(file, 'utf8');
          s = s.split('\\\\${').join('\\${');
          s = s.replace("eligibility.currentName||`a ${label}`", "eligibility.currentName||('a '+label)");
          fs.writeFileSync(file, s);
          NODE
      - name: Apply deterministic source patch
        run: node scripts/apply-v476-recruit-private-chat.mjs
      - name: Remove temporary patch machinery
        run: rm scripts/apply-v476-recruit-private-chat.mjs .github/workflows/v476-apply.yml
      - name: Commit patched source
        run: |
          git config user.name "R4G3RUNN3R"
          git config user.email "ragerunner__gr@hotmail.com"
          git add -A
          git commit -m "feat: add one-click private-chat Recruit preparation"
          git push origin HEAD:feature/recruit-private-chat

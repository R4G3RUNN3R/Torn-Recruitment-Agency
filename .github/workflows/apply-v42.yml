name: Apply v4.2 upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply v4.2 transformation
        run: node scripts/apply-v42.mjs
      - name: Run tests
        run: npm test
      - name: Syntax check
        run: npm run syntax
      - name: Commit generated v4.2 userscript
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R4G3RUNN3R-Recruitment-Agency.user.js
          git commit -m "feat: implement Recruitment Agency v4.2 Results Intelligence"
          git push

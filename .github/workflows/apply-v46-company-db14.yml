name: apply v4.6 company db14

on:
  push:
    branches: [feature/v4.6-company-core]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-company-db14]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-company-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded DB14 patch
        run: |
          node --check scripts/apply-v46-company-db14.js
          node scripts/apply-v46-company-db14.js
          git diff --check
      - name: Commit DB14 integration
        run: |
          if git diff --quiet; then
            echo "Guarded patch produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js tests/v45-browser-upgrade.test.js tests/v46-foundation-static.test.js tests/v46-storage-core.test.js
          git commit -m "feat: integrate additive DB14 company storage"
          git push origin HEAD:feature/v4.6-company-core

name: apply v4.6 company storage task2

on:
  push:
    branches: [feature/v4.6-company-recruitment]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-v46-company-storage-task2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-company-recruitment
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and apply guarded patch
        run: |
          node --check scripts/apply-v46-company-storage-task2.js
          node scripts/apply-v46-company-storage-task2.js
          git diff --check
      - name: Commit DB14 integration
        run: |
          if git diff --quiet; then
            echo "Guarded patch produced no changes" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js package.json tests/v45-browser-duplicate-world.test.js tests/v45-browser-event-interference.test.js tests/v45-browser-hit-test.test.js tests/v45-browser-isolated-world.test.js tests/v45-browser-mobile.test.js tests/v45-browser-shell-ui.test.js tests/v45-browser-torn-host.test.js tests/v45-browser-upgrade.test.js
          git commit -m "feat: wire additive DB14 Company storage"
          git push origin HEAD:feature/v4.6-company-recruitment

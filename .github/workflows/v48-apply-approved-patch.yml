name: Apply verified v4.8 self-update patch

on:
  push:
    branches:
      - feature/v48-simplified-recruitment-ui-clean
    paths:
      - .github/workflows/v48-apply-approved-patch.yml

permissions:
  contents: write

jobs:
  apply-approved-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/v48-simplified-recruitment-ui-clean
          fetch-depth: 0

      - name: Fetch checksum-pinned approved patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://voidsmithindustries.com/torn/recruitment-agency/testing/v48-self-update.patch \
            --output /tmp/v48-self-update.patch
          echo "ec4623a92f8f9fe66e448848294fdac3d16f91f41158b71a298170723d3af8c6  /tmp/v48-self-update.patch" | sha256sum -c -
          git apply --check /tmp/v48-self-update.patch
          git apply /tmp/v48-self-update.patch

      - name: Verify patched candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
          node --check dist/recruitment-agency.user.js
          npm test
          git diff --check

      - name: Commit verified implementation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist package-lock.json
          git rm .github/workflows/v48-apply-approved-patch.yml
          git add -u
          git add scripts/build-userscript.js tests/v48-bundled-release.test.js tests/v48-self-update-distribution.test.js
          git config user.name "Voidsmith Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: self-update Recruitment Agency from Voidsmith VPS"
          git push origin HEAD:feature/v48-simplified-recruitment-ui-clean

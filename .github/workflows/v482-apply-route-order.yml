name: Apply v4.8.2 navigation race fix

on:
  push:
    branches:
      - feature/v482-sort-filter-results
    paths:
      - .github/workflows/v482-apply-route-order.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/v482-sort-filter-results
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download approved navigation-race patch
        run: curl -fsSL https://voidsmithindustries.com/torn/recruitment-agency/testing/v482-navigation-race.patch -o /tmp/v482-navigation-race.patch

      - name: Verify patch checksum
        run: echo '1176f833c4e528e5abbdc06e6f4363c191907919f6726a305725c3eed7c7a394  /tmp/v482-navigation-race.patch' | sha256sum -c -

      - name: Apply patch
        run: |
          git apply --check /tmp/v482-navigation-race.patch
          git apply /tmp/v482-navigation-race.patch

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify v4.8.2 navigation and result contracts
        run: node --test --test-concurrency=1 tests/v482-current-route-idempotence.test.js tests/v482-route-completion-order.test.js tests/v482-results-sorting-filters.test.js tests/v482-browser-controls.test.js tests/v481-active-search.test.js

      - name: Repeat physical-click route regressions
        run: |
          for i in 1 2 3; do
            echo "NAVIGATION RACE CLICK RUN $i"
            node --test --test-concurrency=1 tests/v45-browser-hit-test.test.js tests/v45-browser-isolated-world.test.js
          done

      - name: Verify syntax and formatting
        run: |
          npm run syntax
          git diff --check

      - name: Commit verified fix and remove one-shot workflow
        run: |
          rm .github/workflows/v482-apply-route-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/v45-app.js
          git add -u .github/workflows/v482-apply-route-order.yml
          git commit -m 'fix: make active recruitment navigation race-free'
          git push origin HEAD:feature/v482-sort-filter-results

name: package v4.7.3 release

on:
  push:
    branches:
      - hotfix/v4.7.3-navigation-scope

permissions:
  contents: write

jobs:
  package:
    if: ${{ !contains(github.event.head_commit.message, '[v473-packaged]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v4.7.3-navigation-scope
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify behavior-gate source state
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const app=fs.readFileSync('src/v45-app.js','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const boot=fs.readFileSync('R4G3RUNN3R-Recruitment-Agency.user.js','utf8');
          if(!/SCRIPT_VERSION\s*=\s*'4\.7\.2'/.test(app)) throw new Error('Expected pre-release source version 4.7.2');
          if(pkg.version!=='4.7.2') throw new Error(`Expected package 4.7.2, got ${pkg.version}`);
          if(!/@version\s+4\.7\.2/.test(boot)) throw new Error('Expected public wrapper 4.7.2');
          if(!app.includes("target?.querySelectorAll('[data-page]')")) throw new Error('Scoped RA navigation fix missing');
          if(!app.includes("if(!V46Navigation.ROUTES.includes(requested)")) throw new Error('Strict live-route guard missing');
          NODE

      - name: Create immutable v4.7.3 source commit
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='src/v45-app.js';
          let text=fs.readFileSync(path,'utf8');
          const next=text.replace(/const SCRIPT_VERSION\s*=\s*'4\.7\.2';/,"const SCRIPT_VERSION = '4.7.3';");
          if(next===text) throw new Error('SCRIPT_VERSION replacement did not occur');
          if((next.match(/SCRIPT_VERSION\s*=\s*'4\.7\.3'/g)||[]).length!==1) throw new Error('Unexpected v4.7.3 source-version count');
          fs.writeFileSync(path,next);
          NODE
          node --check src/v45-app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js
          git diff --cached --check
          git commit -m "release: v4.7.3 immutable source"
          git push origin HEAD:hotfix/v4.7.3-navigation-scope
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify immutable source is fetchable
        shell: bash
        run: |
          url="https://raw.githubusercontent.com/R4G3RUNN3R/Torn-Recruitment-Agency/${SOURCE_SHA}/src/v45-app.js"
          ok=0
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "$url" -o /tmp/v45-app.js && grep -Eq "SCRIPT_VERSION[[:space:]]*=[[:space:]]*'4\.7\.3'" /tmp/v45-app.js; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          echo "Verified immutable source ${SOURCE_SHA}"

      - name: Build public v4.7.3 package
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const source=process.env.SOURCE_SHA;
          const oldSource='bba0de9ac95fcfb280335f63a9c2a47dc2a5db41';
          if(!/^[0-9a-f]{40}$/.test(source||'')) throw new Error(`Invalid SOURCE_SHA ${source}`);

          const bootPath='R4G3RUNN3R-Recruitment-Agency.user.js';
          let boot=fs.readFileSync(bootPath,'utf8');
          boot=boot.replace(/(\/\/ @version\s+)4\.7\.2/, '$14.7.3');
          boot=boot.replace(/const INSTALLER_VERSION\s*=\s*'4\.7\.2';/, "const INSTALLER_VERSION = '4.7.3';");
          boot=boot.replace(/const EXPECTED_APP_VERSION\s*=\s*'4\.7\.2';/, "const EXPECTED_APP_VERSION = '4.7.3';");
          boot=boot.split(oldSource).join(source);
          const requires=[...boot.matchAll(/^\/\/ @require\s+(\S+)/gm)].map(m=>m[1]);
          if(requires.length!==29) throw new Error(`Expected 29 @require entries, found ${requires.length}`);
          for(const url of requires){
            if(!url.includes(`/Torn-Recruitment-Agency/${source}/src/`)) throw new Error(`Unpinned or wrong-source @require: ${url}`);
          }
          if(!/@version\s+4\.7\.3/.test(boot)) throw new Error('Public @version was not updated');
          if(!/INSTALLER_VERSION\s*=\s*'4\.7\.3'/.test(boot)||!/EXPECTED_APP_VERSION\s*=\s*'4\.7\.3'/.test(boot)) throw new Error('Installer/runtime version contract not updated');
          fs.writeFileSync(bootPath,boot);

          const pkgPath='package.json';
          const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8'));
          pkg.version='4.7.3';
          fs.writeFileSync(pkgPath,JSON.stringify(pkg,null,2)+'\n');

          for(const path of ['tests/v47-runtime-version.test.js','tests/v47-release-contract.test.js','tests/v46-foundation-static.test.js','tests/userscript-static.test.js']){
            let text=fs.readFileSync(path,'utf8');
            text=text.split('4.7.2').join('4.7.3').split('4\\.7\\.2').join('4\\.7\\.3');
            if(path==='tests/userscript-static.test.js') text=text.split(oldSource).join(source);
            fs.writeFileSync(path,text);
          }

          const readmePath='README.md';
          let readme=fs.readFileSync(readmePath,'utf8');
          readme=readme.replace("R4G3RUNN3R's Recruitment Agency **v4.7.2** is", "R4G3RUNN3R's Recruitment Agency **v4.7.3** is");
          const blockStart=readme.indexOf('## v4.7.2 routing hotfix');
          const blockEnd=readme.indexOf('## v4.7 Faction Recruitment release',blockStart);
          if(blockStart<0||blockEnd<0) throw new Error('Could not locate current routing-hotfix README block');
          const replacement=`## v4.7.3 navigation ownership hotfix\n\n**v4.7.3 hotfix:** Recruitment Agency navigation now binds only to controls inside its own \`#ra-nav\` sidebar. v4.7.2 still used document-global \`[data-page]\` / \`[data-nav-toggle]\` selectors, so Torn-owned controls could be claimed by the Recruitment Agency router. When one of those controls supplied a value that was not a Recruitment Agency route, the old live router normalized it to Company Overview. v4.7.3 also rejects invalid live route requests instead of converting them to Company Overview. Startup restoration still safely normalizes legacy persisted routes.\n\nRegression coverage now reproduces the exact \`faction-candidates -> company-overview\` fallback using a foreign Torn-style \`data-page=\"2\"\` control, verifies the Torn control keeps its own click handler, verifies invalid live routes leave the current Recruitment Agency page untouched, and exercises Faction Requirements in-page controls through both the public bootstrap and a Tampermonkey-like isolated userscript world.\n\n## v4.7.2 routing hotfix (historical)\n\nv4.7.2 made the central route state synchronous and added stale asynchronous-render protection. Those changes remain valid, but user testing proved they did **not** eliminate the live Company Overview snapback because a separate document-global navigation ownership defect still existed. v4.7.3 supersedes v4.7.2 for that live defect.\n\n`;
          readme=readme.slice(0,blockStart)+replacement+readme.slice(blockEnd);
          readme=readme.replace(/The public userscript pins all \*\*29\*\* runtime modules immutably to reviewed v4\.7\.2 source commit `[^`]+`\./,`The public userscript pins all **29** runtime modules immutably to reviewed v4.7.3 source commit \`${source}\`.`);
          readme=readme.replace(/The public userscript metadata is version \*\*4\.7\.2\*\*\. All \*\*29\*\* application modules are loaded through immutable commit-pinned `@require` URLs pointing to reviewed source commit `[^`]+`/,`The public userscript metadata is version **4.7.3**. All **29** application modules are loaded through immutable commit-pinned \`@require\` URLs pointing to reviewed source commit \`${source}\``);
          const history='- **v4.7.2** - central state-first recruitment route authority, stale asynchronous render protection, and direct Company/Faction/cross-domain route-race regressions; supersedes v4.7.1 for the live Company Overview snapback defect';
          if(!readme.includes(history)) throw new Error('Could not locate v4.7.2 version-history line');
          readme=readme.replace(history,`- **v4.7.3** - scopes Recruitment Agency navigation ownership to its own sidebar, preserves Torn-owned controls, rejects invalid live routes instead of falling back to Company Overview, and adds public-bootstrap/isolated-world in-page regressions\n- **v4.7.2** - central state-first route authority and stale asynchronous-render protection; valid but incomplete for the live Company Overview snapback, which still had a separate document-global navigation ownership cause`);
          fs.writeFileSync(readmePath,readme);

          const release=`# Recruitment Agency v4.7.3 - Navigation Ownership Hotfix\n\nDate: 26 August 2026\n\n## Status\n\nThis release supersedes v4.7.2 for the live Company Overview snapback defect. v4.7.2 correctly made canonical route state synchronous and protected newer routes from stale asynchronous renders, but user testing proved that a separate live trigger remained.\n\n## Root cause reproduced\n\nThe Recruitment Agency sidebar rebuild used document-global \`document.querySelectorAll('[data-page]')\` and \`document.querySelectorAll('[data-nav-toggle]')\` bindings. Torn-owned controls using the same attributes could therefore be assigned Recruitment Agency click handlers. Unknown live route values were normalized by the Recruitment Agency navigation helper to \`company-overview\`.\n\nA regression on unchanged v4.7.2 reproduced the exact failure: while on \`faction-candidates\`, clicking a foreign Torn-style \`data-page=\"2\"\` control changed canonical Recruitment Agency state to \`company-overview\`. The same diagnostic also proved that the Recruitment Agency overwrote the foreign control's own click handler.\n\n## Fix\n\n- Navigation and group-toggle binding is scoped to \`#ra-nav\` only.\n- Active-route highlighting is also scoped to \`#ra-nav\`.\n- Torn-owned controls outside Recruitment Agency retain their own handlers.\n- Live route requests are accepted only when they are explicit Recruitment Agency routes visible for the current complexity mode. Invalid live route values return without changing the active page.\n- Startup/restoration still uses the existing normalization path so legacy persisted route values remain recoverable.\n\n## Verification\n\nBefore packaging, the clean behavior branch passed 280/280 tests plus the full JavaScript syntax gate. New coverage includes:\n\n- exact foreign-control \`faction-candidates -> company-overview\` red-to-green regression;\n- invalid live-route rejection without page mutation;\n- real Chrome with the public userscript bootstrap, physically clicking Faction Requirements -> Add Requirement -> Create Specialist Profile while remaining on Faction Requirements;\n- a Tampermonkey-like CDP isolated userscript world performing the same physical in-page interactions;\n- existing real Torn-host, isolated-world, DB11->DB15 migration, Company/Faction isolation, privacy, API pacing, and manual-messaging checks.\n\nThe public release pins all 29 runtime modules to immutable source commit \`${source}\`.\n\nNo database migration is required. DB15 is unchanged. No Recruitment Agency data reset is required.\n`;
          fs.writeFileSync('docs/releases/v4.7.3-navigation-ownership-hotfix.md',release);
          NODE

      - name: Run complete packaged release verification
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run syntax
          node <<'NODE'
          const fs=require('fs');
          const source=process.env.SOURCE_SHA;
          const boot=fs.readFileSync('R4G3RUNN3R-Recruitment-Agency.user.js','utf8');
          const requires=[...boot.matchAll(/^\/\/ @require\s+(\S+)/gm)].map(m=>m[1]);
          if(requires.length!==29) throw new Error(`Expected 29 @require entries, found ${requires.length}`);
          if(requires.some(url=>!url.includes(`/${source}/src/`))) throw new Error('Not all runtime requires point at the immutable v4.7.3 source');
          const app=fs.readFileSync('src/v45-app.js','utf8');
          if(!/SCRIPT_VERSION\s*=\s*'4\.7\.3'/.test(app)) throw new Error('Source runtime is not 4.7.3');
          NODE

      - name: Commit public v4.7.3 release package
        shell: bash
        run: |
          git add R4G3RUNN3R-Recruitment-Agency.user.js README.md package.json src/v45-app.js tests/v47-runtime-version.test.js tests/v47-release-contract.test.js tests/v46-foundation-static.test.js tests/userscript-static.test.js docs/releases/v4.7.3-navigation-ownership-hotfix.md
          git diff --cached --check
          git commit -m "release: publish v4.7.3 navigation ownership hotfix [v473-packaged]"
          git push origin HEAD:hotfix/v4.7.3-navigation-scope
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report immutable release identities
        shell: bash
        run: |
          echo "SOURCE_SHA=${SOURCE_SHA}"
          echo "RELEASE_SHA=${RELEASE_SHA}"

name: patch-v46-company-ui
on:
  push:
    branches: [feature/v4.6-company-recruitment]
    paths: ['.github/workflows/patch-v46-company-ui.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v4.6-company-recruitment
      - name: Apply guarded Company UI integration
        shell: python
        run: |
          from pathlib import Path

          def replace(path,old,new,count=1):
              p=Path(path); text=p.read_text(); actual=text.count(old)
              if actual!=count: raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:120]!r}')
              p.write_text(text.replace(old,new,count))

          app='src/v45-app.js'
          replace(app,"    V46CompanyCore: root && root.RA_V46CompanyCore,\n    V46CompanyStorage: root && root.RA_V46CompanyStorage\n","    V46CompanyCore: root && root.RA_V46CompanyCore,\n    V46CompanyStorage: root && root.RA_V46CompanyStorage,\n    V46CompanyUI: root && root.RA_V46CompanyUI\n")
          replace(app,"    deps.V46CompanyCore = require('./v46-company-core');\n    deps.V46CompanyStorage = require('./v46-company-storage');\n","    deps.V46CompanyCore = require('./v46-company-core');\n    deps.V46CompanyStorage = require('./v46-company-storage');\n    deps.V46CompanyUI = require('./v46-company-ui');\n")
          replace(app,"const {ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage} = D;","const {ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage,V46CompanyUI} = D;")
          replace(app,"if (![ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage].every(Boolean)) {","if (![ScoutCore,ResultsCore,GlobalCore,MatchCore,ForumCore,Runtime,Candidates,Discovery,Messaging,V46Domain,V46Storage,V46Navigation,V46CompanyCore,V46CompanyStorage,V46CompanyUI].every(Boolean)) {")

          marker="  async function renderData(){const candidates=await idb.getAll('candidateLocal'),sources=await idb.getAll('forumSources'),logs=await idb.getAll('appLogs');"
          if Path(app).read_text().count(marker)!=1: raise SystemExit('renderData marker mismatch')
          company_funcs="""  async function companyWorkflowRows(){
    const [companyRecords,players,config]=await Promise.all([idb.getAll('companyRecruitment'),idb.getAll('playerIntelligence'),companyRepositories.config.get()]);
    const baseline=V46CompanyCore.normalizeBaseline(config.baseline||{});
    return V46CompanyUI.buildCandidateRows(companyRecords,players,{eligibilityFor:(record,player)=>V46CompanyCore.evaluateCriteria(baseline.criteria,player,record.waivers||[])});
  }
  async function renderCompanyOverview(){const [rows,vacancies]=await Promise.all([companyWorkflowRows(),companyRepositories.vacancies.list()]);return V46CompanyUI.renderOverview(V46CompanyUI.buildOverviewModel(rows,vacancies));}
  async function renderCompanyToday(){const [rows,config]=await Promise.all([companyWorkflowRows(),companyRepositories.config.get()]);const opportunities=Object.fromEntries(rows.map(row=>[row.userId,number(row.opportunityScore,0)]));return V46CompanyUI.renderToday(V46CompanyUI.buildTodayModel(rows,{now:Date.now(),stageThresholds:config.stageThresholds,opportunities}));}
  async function renderCompanyCandidates(){return V46CompanyUI.renderCandidates(await companyWorkflowRows());}
  async function renderCompanyPipeline(){return V46CompanyUI.renderPipeline(V46CompanyUI.buildPipelineModel(await companyWorkflowRows()));}

"""
          text=Path(app).read_text().replace(marker,company_funcs+marker,1)
          Path(app).write_text(text)

          replace(app,"const renderers={'company-overview':renderOverview,'company-discover':renderDiscover,'company-candidates':renderCandidates,'company-pipeline':renderPipeline,'company-today':renderCompanyPlaceholder,","const renderers={'company-overview':renderCompanyOverview,'company-discover':renderDiscover,'company-candidates':renderCompanyCandidates,'company-pipeline':renderCompanyPipeline,'company-today':renderCompanyToday,")
          replace(app,"return Object.freeze({SCRIPT_VERSION,DB_VERSION,HARD_API_RATE,MIN_API_GAP_MS,DEFAULT_VISIBLE_COLUMNS,OPTIONAL_COLUMNS,openDB,mergeSettings,start,_test:{state,repositories,companyRepositories,recruitmentDomainForFeed,persistDiscoveredCandidate,deleteCompanyCandidateData,clearRecruitmentData,applyCandidateFilters,candidateCsvRow,matchAvailability,forumThreadUrl}});","return Object.freeze({SCRIPT_VERSION,DB_VERSION,HARD_API_RATE,MIN_API_GAP_MS,DEFAULT_VISIBLE_COLUMNS,OPTIONAL_COLUMNS,openDB,mergeSettings,start,_test:{state,repositories,companyRepositories,companyWorkflowRows,recruitmentDomainForFeed,persistDiscoveredCandidate,deleteCompanyCandidateData,clearRecruitmentData,applyCandidateFilters,candidateCsvRow,matchAvailability,forumThreadUrl}});")

          # Every browser harness that loads the source app must load Company UI before v45-app.
          for p in Path('tests').glob('*.test.js'):
              text=p.read_text()
              old="'v46-company-storage.js','v45-app.js'"
              if old in text:
                  p.write_text(text.replace(old,"'v46-company-storage.js','v46-company-ui.js','v45-app.js'"))

          # Static integration contract.
          test=Path('tests/v46-company-ui-static.test.js')
          test.write_text("""const test=require('node:test');\nconst assert=require('node:assert/strict');\nconst fs=require('node:fs');\nconst path=require('node:path');\nconst app=fs.readFileSync(path.join(__dirname,'..','src','v45-app.js'),'utf8');\n\ntest('Company UI is a required app dependency and powers the four implemented Company routes',()=>{\n  assert.match(app,/V46CompanyUI:\\s*root\\s*&&\\s*root\\.RA_V46CompanyUI/);\n  assert.match(app,/deps\\.V46CompanyUI = require\\('\.\\/v46-company-ui'\\)/);\n  assert.match(app,/'company-overview':renderCompanyOverview/);\n  assert.match(app,/'company-today':renderCompanyToday/);\n  assert.match(app,/'company-candidates':renderCompanyCandidates/);\n  assert.match(app,/'company-pipeline':renderCompanyPipeline/);\n});\n\ntest('Company workflow rows read Company recruitment plus shared intelligence without reading Faction workflow state',()=>{\n  const start=app.indexOf('async function companyWorkflowRows()');\n  const end=app.indexOf('async function renderCompanyOverview()',start);\n  assert.ok(start>=0&&end>start);\n  const body=app.slice(start,end);\n  assert.match(body,/idb\\.getAll\\('companyRecruitment'\\)/);\n  assert.match(body,/idb\\.getAll\\('playerIntelligence'\\)/);\n  assert.doesNotMatch(body,/factionRecruitment/);\n  assert.match(body,/V46CompanyCore\\.evaluateCriteria/);\n});\n""")
      - name: Commit guarded integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v45-app.js tests
          git diff --cached --check
          git commit -m "feat: power Company workflow pages from separated domain data"
          git push

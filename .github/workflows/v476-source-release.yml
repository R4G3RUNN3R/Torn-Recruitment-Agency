name: prepare-v476-source-release

on:
  push:
    branches: [feature/recruit-private-chat]
    paths:
      - '.github/workflows/v476-source-release.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recruit-private-chat
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare v4.7.6 source release
        run: |
          node - <<'NODE'
          const fs=require('fs');
          function edit(file,fn){const before=fs.readFileSync(file,'utf8');const after=fn(before);if(after===before)throw new Error('No change in '+file);fs.writeFileSync(file,after);}
          function once(text,from,to,label){const count=text.split(from).length-1;if(count!==1)throw new Error(label+': expected 1 match, got '+count);return text.replace(from,to);}

          edit('src/v45-app.js',s=>once(s,"const SCRIPT_VERSION = '4.7.4';","const SCRIPT_VERSION = '4.7.6';",'app version'));
          edit('package.json',s=>once(s,'"version": "4.7.5"','"version": "4.7.6"','package version'));
          edit('tests/v47-runtime-version.test.js',s=>s
            .replace("v4.7.5 public shell keeps the reviewed core runtime at 4.7.4","v4.7.6 Recruit release uses the v4.7.6 core runtime")
            .replace(/SCRIPT_VERSION\\s\*=\\s\*'4\\\.7\\\.4'/,"SCRIPT_VERSION\\s*=\\s*'4\\.7\\.6'"));
          edit('tests/v47-release-contract.test.js',s=>s
            .replace("release package version is 4.7.5","release package version is 4.7.6")
            .replace("assert.equal(pkg.version,'4.7.5');","assert.equal(pkg.version,'4.7.6');")
            .replace("README identifies v4.7.5 as the public shell release over the v4.7.4 immutable core","README identifies v4.7.6 as the private-chat Recruit release")
            .replace(/assert\.match\(readme,\/Recruitment Agency \\\*\\\*v4\\\.7\\\.5\\\*\\\*\/\);/,"assert.match(readme,/Recruitment Agency \\\*\\\*v4\\.7\\.6\\\*\\\*/);")
            .replace(/\s*assert\.match\(readme,\/999a2f9eafd28891dc5de461f08b1d29bbd41eea\/\);/,'')
            .replace(/\s*assert\.match\(readme,\/core runtime remains \\\*\\\*v4\\\.7\\\.4\\\*\\\*\/i\);/,'')
            .replace("  assert.match(readme,/DB15/);","  assert.match(readme,/private chat/i);\n  assert.match(readme,/manual.*Send/i);\n  assert.match(readme,/DB15/);"));
          edit('README.md',s=>{
            s=once(s,"R4G3RUNN3R's Recruitment Agency **v4.7.5**","R4G3RUNN3R's Recruitment Agency **v4.7.6**",'README version');
            const marker='## v4.7.5 dark-theme readability hotfix';
            const section=`## v4.7.6 private-chat Recruit workflow\n\n**v4.7.6** adds a clear **Recruit** action to Company and Faction candidate rows. Recruit performs a fresh official Torn v2 membership check before preparing contact: Company recruitment checks the target's current job/company, while Faction recruitment checks current faction membership. If the player already belongs to the relevant organization type, recruitment stops and reports that membership.\n\nCompany and Faction recruitment templates are separate, browser-local settings. Company supports \`{name}\`, \`{company_name}\`, and \`{company_type}\`; Faction supports \`{name}\` and \`{faction_name}\`. The defaults are editable and saved for reuse.\n\nRecruitment contact uses **Torn private chat**, not Torn Messages/Mail. For an eligible player, the script opens the target profile, opens the Torn private-chat surface, inserts the prepared text, and focuses the chat input. The final Torn **Send** remains a manual player action: v4.7.6 does not click Send, synthesize Enter, auto-submit a chat, or mutate recruitment stage merely because a draft was prepared. Do Not Contact protections remain in force with the existing deliberate override path.\n\nThe feature keeps DB15 unchanged, preserves strict Company/Faction workflow isolation, uses the shared official Torn v2 scheduler, and does not expand the Global Intelligence whitelist. A real-Chrome regression verifies the private-chat draft handoff and explicitly asserts zero Send clicks and zero Enter submissions.\n\n`;
            if(!s.includes(marker))throw new Error('README hotfix marker missing');
            return s.replace(marker,section+marker);
          });

          fs.writeFileSync('.github/workflows/test.yml',`name: test\n\non:\n  push:\n    branches: [main]\n  pull_request:\n\njobs:\n  verify:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: '20'\n      - name: Install test dependencies\n        run: npm install --no-audit --no-fund\n      - name: Run unit and runtime smoke tests\n        run: npm test\n      - name: Check JavaScript syntax\n        run: npm run syntax\n`);
          try{fs.rmSync('docs/.v476-ci-trigger');}catch{}
          try{fs.rmSync('.github/workflows/v476-source-release.yml');}catch{}
          NODE
      - name: Commit immutable-source candidate
        run: |
          git config user.name "R4G3RUNN3R"
          git config user.email "ragerunner__gr@hotmail.com"
          git add -A
          git commit -m "release: prepare v4.7.6 private-chat Recruit source"
          git push origin HEAD:feature/recruit-private-chat

name: v4.7 release patch

on:
  push:
    branches:
      - release/v4.7.0
    paths:
      - .github/workflows/v47-release-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v4.7.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Apply guarded v4.7 release patch
        run: |
          node <<'NODE'
          const fs=require('fs');

          function replaceExactly(source,from,to,label){
            const count=source.split(from).length-1;
            if(count!==1) throw new Error(`Expected exactly one ${label || from}; found ${count}`);
            return source.replace(from,to);
          }

          const oldSha='520da615d418d42524761e774f10f3ab26c28572';
          const runtimeSha='4de6d7f59f19765d3888b5a43284e3aca48ac719';
          const userscriptPath='R4G3RUNN3R-Recruitment-Agency.user.js';
          let boot=fs.readFileSync(userscriptPath,'utf8');
          const oldPinCount=boot.split(oldSha).length-1;
          if(oldPinCount!==21) throw new Error(`Expected 21 old immutable runtime pins; found ${oldPinCount}`);
          boot=boot.split(oldSha).join(runtimeSha);
          boot=replaceExactly(boot,'// @version      4.6.0','// @version      4.7.0','userscript @version');
          boot=replaceExactly(
            boot,
            '// @description  Recruitment discovery, candidate pipeline, Scout intelligence and local recruitment workflow for Torn.',
            '// @description  Company and Faction recruitment workflows with shared Player Intelligence, Scout, Smart Match and local-first persistence for Torn.',
            'userscript description'
          );
          const companyPlatform=`// @require      https://raw.githubusercontent.com/R4G3RUNN3R/Torn-Recruitment-Agency/${runtimeSha}/src/v46-company-platform.js`;
          const appLine=`// @require      https://raw.githubusercontent.com/R4G3RUNN3R/Torn-Recruitment-Agency/${runtimeSha}/src/v45-app.js`;
          const factionLines=[
            'v47-faction-core.js',
            'v47-faction-storage.js',
            'v47-faction-ui.js',
            'v47-faction-operations.js',
            'v47-faction-workflow.js',
            'v47-faction-workflow-ui.js',
            'v47-faction-opportunity-ui.js',
            'v47-faction-platform.js'
          ].map(file=>`// @require      https://raw.githubusercontent.com/R4G3RUNN3R/Torn-Recruitment-Agency/${runtimeSha}/src/${file}`).join('\n');
          boot=replaceExactly(boot,`${companyPlatform}\n${appLine}`,`${companyPlatform}\n${factionLines}\n${appLine}`,'Company-to-Faction userscript dependency boundary');
          boot=replaceExactly(boot,"const INSTALLER_VERSION = '4.6.0';","const INSTALLER_VERSION = '4.7.0';",'INSTALLER_VERSION');
          boot=replaceExactly(boot,"const EXPECTED_APP_VERSION = '4.6.0';","const EXPECTED_APP_VERSION = '4.7.0';",'EXPECTED_APP_VERSION');
          if(boot.split(runtimeSha).length-1!==29) throw new Error('Expected all 29 public runtime requires to share one immutable v4.7 source SHA.');
          fs.writeFileSync(userscriptPath,boot);

          const packagePath='package.json';
          const pkg=JSON.parse(fs.readFileSync(packagePath,'utf8'));
          if(pkg.version!=='4.6.0') throw new Error(`Expected package version 4.6.0 before release; found ${pkg.version}`);
          pkg.version='4.7.0';
          fs.writeFileSync(packagePath,JSON.stringify(pkg,null,2)+'\n');

          const readmePath='README.md';
          let readme=fs.readFileSync(readmePath,'utf8');
          const releaseStart="R4G3RUNN3R's Recruitment Agency **v4.6.0**";
          const releaseEnd='\n\n## What\'s new in v4.5';
          const startAt=readme.indexOf(releaseStart);
          const endAt=readme.indexOf(releaseEnd);
          if(startAt<0||endAt<=startAt) throw new Error('Could not locate the existing README release introduction.');
          const releaseIntro=`R4G3RUNN3R's Recruitment Agency **v4.7.0** is a modular Torn recruitment workspace with separate Company and Faction recruitment workflows over one shared Player Intelligence identity, plus official forum discovery, Scout intelligence, local-only Smart Match scoring, optional Global Intelligence, contextual help, and safe browser-local persistence.

The Scout, Results, Global Intelligence, Smart Match, Forum Discovery, Company Recruitment, and Faction Recruitment modules are clean-room implementations. They do not call, authenticate against, or depend on \`rs.dnonetwork.com\` or another proprietary Recruit Scout grading backend.

## v4.7 Faction Recruitment release

The public **v4.7.0** release adds the complete Faction Recruitment slice alongside the existing Company Recruitment workflow without merging their private state.

- IndexedDB now upgrades additively through **DB15**. DB13 owns \`playerIntelligence\`, \`companyRecruitment\`, and \`factionRecruitment\`; DB14 adds \`companyVacancies\`, \`companyCampaigns\`, \`companyRecruitmentConfig\`, and \`companyRecruitmentSessions\`; DB15 adds \`factionSpecialistProfiles\`, \`factionCampaigns\`, \`factionRecruitmentConfig\`, and \`factionRecruitmentSessions\`. No prior object store is deleted.
- One Torn player ID maps to one shared Player Intelligence identity. Company and Faction stages, notes, follow-ups, campaigns, waivers, matching context, and workflow history remain separate and local.
- Company Recruitment keeps its dedicated Overview, Today, Discover, Candidates, Pipeline, Vacancies, Campaigns, Follow-ups, Timeline, Stage Aging, Contact Outcomes, Recruitment Sessions, Talent Pool, Reactivation, Opportunity Queue, and Compare routes.
- Faction Recruitment adds dedicated Overview, Today, Discover, Candidates, Pipeline, Requirements, Campaigns, Follow-ups, Timeline, Stage Aging, Contact Outcomes, Recruitment Sessions, Reactivation, Opportunity, and Compare routes.
- Faction Baseline Hard failures block only **Invite Ready** unless individually waived. Specialist Hard failures affect only that specialist profile and never block Invite Ready when the baseline is eligible. Manual specialist pins are never silently overwritten.
- Faction waiver management records baseline or specialist scope, reason, review date, Active/Resolved state, and resolution history while keeping the failed underlying requirement visible. DNC remains a separate explicit flag and recruitment messaging remains manual-send only.
- Scout and recruitment observations update shared Player Intelligence only through the approved fact-field boundary; recruitment-private fields never enter Global Intelligence through the generic merge path.
- The public userscript pins all **29** runtime modules immutably to reviewed source commit \`${runtimeSha}\`. Its release regression suite fetches the exact pinned \`v45-app.js\` and verifies that its \`SCRIPT_VERSION\` equals the installer\'s expected runtime version before publication.`;
          readme=readme.slice(0,startAt)+releaseIntro+readme.slice(endAt);
          readme=replaceExactly(readme,'## Local storage and DB v12\n\nv4.5 uses IndexedDB version **12** with additive migration only.\n\nThe v4.5 recruitment stores include:','## Local storage and DB15\n\nThe current v4.7 application uses IndexedDB version **15** with additive migration only. DB13 introduces the shared/domain foundation, DB14 adds Company support stores, and DB15 adds Faction support stores. Existing stores are preserved.\n\nLegacy v4.5 recruitment stores remain part of the additive upgrade path and include:','README DB section');
          readme=replaceExactly(readme,'The public userscript metadata is version **4.5.4**. Its application modules are loaded from the repository through immutable commit-pinned `@require` URLs rather than mutable branch URLs.',`The public userscript metadata is version **4.7.0**. All application modules are loaded through immutable commit-pinned \`@require\` URLs pointing to reviewed source commit \`${runtimeSha}\`, while \`@updateURL\` and \`@downloadURL\` remain on \`main\` for normal userscript-manager updates.`,'README install metadata');
          readme=replaceExactly(readme,'The v4.5 release regression suite covers the exact pipeline stages, DB12 migration contract, Global Intelligence whitelist, API pacing, shared scheduler, safe forum checkpoint ordering, local/private-field boundaries, manual message sending, routed Settings, candidate workspace/pipeline behavior, responsive shell, internal scrolling, Maximize/Restore geometry preservation, hostile host click capture, contextual help, and syntax of the public userscript and application modules.','The v4.7 release regression suite covers Company/Faction workflow isolation, the exact domain stage contracts, additive DB11→DB15 upgrades, Faction waivers and specialist matching, shared Player Intelligence boundaries, the Global Intelligence whitelist, API pacing, manual messaging, routed UI/browser interaction, immutable userscript dependency order, exact pinned-runtime version integrity, and JavaScript syntax.','README testing paragraph');
          readme=replaceExactly(readme,'## Version history\n\n- **v4.5.4**','## Version history\n\n- **v4.7.0** - complete Faction Recruitment workflow, DB15 additive storage, specialist profiles, scoped waivers, Opportunity/Compare, Company/Faction isolation, and immutable runtime-pin integrity checks\n- **v4.6.0** - Company Recruitment foundation and complete Company workflow slice (publication later superseded by v4.7.0 after an immutable runtime-pin mismatch was detected)\n- **v4.5.4**','README version history');
          fs.writeFileSync(readmePath,readme);
          NODE
      - name: Verify release tests
        run: npm test
      - name: Verify JavaScript syntax
        run: npm run syntax
      - name: Commit verified public release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R4G3RUNN3R-Recruitment-Agency.user.js package.json README.md
          git diff --cached --check
          git commit -m "release: publish v4.7.0 faction recruitment"
          git push origin HEAD:release/v4.7.0

name: v4.7 runtime prep patch

on:
  push:
    branches:
      - release/v4.7-runtime-prep
    paths:
      - .github/workflows/v47-runtime-prep-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v4.7-runtime-prep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Apply guarded runtime identity patch
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='src/v45-app.js';
          let source=fs.readFileSync(path,'utf8');
          const replacements=[
            ["const SCRIPT_VERSION = '4.6.0';","const SCRIPT_VERSION = '4.7.0';"],
            ["Recruitment Agency v4.6 source started","Recruitment Agency v4.7 source started"]
          ];
          for(const [from,to] of replacements){
            const count=source.split(from).length-1;
            if(count!==1) throw new Error(`Expected exactly one occurrence of ${from}, found ${count}`);
            source=source.replace(from,to);
          }
          fs.writeFileSync(path,source);
          NODE
      - name: Run full tests
        run: npm test
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit verified runtime identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js
          git diff --cached --check
          git commit -m "chore: prepare v4.7 runtime identity"
          git push origin HEAD:release/v4.7-runtime-prep

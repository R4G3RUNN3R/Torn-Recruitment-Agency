name: v4.7 runtime prep patch

on:
  push:
    branches:
      - release/v4.7-runtime-prep
    paths:
      - .github/workflows/v47-runtime-prep-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v4.7-runtime-prep
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Apply guarded runtime and browser-harness patch
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceExactly(file,from,to){
            let source=fs.readFileSync(file,'utf8');
            const count=source.split(from).length-1;
            if(count!==1) throw new Error(`Expected exactly one occurrence in ${file}: ${from}; found ${count}`);
            source=source.replace(from,to);
            fs.writeFileSync(file,source);
          }

          replaceExactly('src/v45-app.js',"const SCRIPT_VERSION = '4.6.0';","const SCRIPT_VERSION = '4.7.0';");
          replaceExactly('src/v45-app.js','Recruitment Agency v4.6 source started','Recruitment Agency v4.7 source started');

          for(const file of ['tests/v45-browser-duplicate-world.test.js','tests/v45-browser-event-interference.test.js','tests/v45-browser-shell-ui.test.js']){
            replaceExactly(file,"const puppeteer = require('puppeteer-core');","const puppeteer = require('puppeteer-core');\nconst sourceCompatibleBoot = require('./source-compatible-boot');");
          }
          replaceExactly('tests/v45-browser-duplicate-world.test.js',"const BOOT = fs.readFileSync(path.join(ROOT,'R4G3RUNN3R-Recruitment-Agency.user.js'),'utf8');","const BOOT = sourceCompatibleBoot(ROOT);");
          for(const file of ['tests/v45-browser-event-interference.test.js','tests/v45-browser-shell-ui.test.js']){
            replaceExactly(file,"await page.addScriptTag({content:fs.readFileSync(path.join(ROOT,'R4G3RUNN3R-Recruitment-Agency.user.js'),'utf8')});","await page.addScriptTag({content:sourceCompatibleBoot(ROOT)});");
          }
          NODE
      - name: Run full tests
        run: npm test
      - name: Run syntax checks
        run: npm run syntax
      - name: Commit verified runtime identity and harness boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js tests/v45-browser-duplicate-world.test.js tests/v45-browser-event-interference.test.js tests/v45-browser-shell-ui.test.js
          git diff --cached --check
          git commit -m "chore: prepare v4.7 runtime identity"
          git push origin HEAD:release/v4.7-runtime-prep

name: v4.7.3 strict live route patch

on:
  push:
    branches:
      - hotfix/v4.7.3-navigation-scope

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[strict-route-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v4.7.3-navigation-scope
      - name: Reject invalid live routes instead of falling back to Company Overview
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='src/v45-app.js';
          let text=fs.readFileSync(path,'utf8');
          const oldRoute="    state.page=V46Navigation.normalizeRoute(page,state.settings.complexity);";
          const newRoute="    const requested=String(page||'').trim().toLowerCase();\n    if(!V46Navigation.ROUTES.includes(requested)||(requested==='logs'&&state.settings.complexity!=='advanced')return false;\n    state.page=requested;";
          if(text.includes(oldRoute)) text=text.replace(oldRoute,newRoute);
          else if(!text.includes("if(!V46Navigation.ROUTES.includes(requested)")) throw new Error('route assignment not found');
          const oldExport="start,_test:{state,repositories,companyRepositories,factionRepositories";
          const newExport="start,_test:{navigate:route,state,repositories,companyRepositories,factionRepositories";
          if(text.includes(oldExport)) text=text.replace(oldExport,newExport);
          else if(!text.includes("_test:{navigate:route,state")) throw new Error('test export seam not found');
          fs.writeFileSync(path,text);
          NODE
      - name: Validate syntax before commit
        run: node --check src/v45-app.js
      - name: Commit strict live-route guard
        shell: bash
        run: |
          if git diff --quiet -- src/v45-app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js
          git diff --cached --check
          git commit -m "fix: reject invalid live routes [strict-route-patched]"
          git push origin HEAD:hotfix/v4.7.3-navigation-scope

name: v4.7.3 scoped navigation patch

on:
  push:
    branches:
      - diag/v4.7.2-live-click-path

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scope-nav-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/v4.7.2-live-click-path
      - name: Scope Recruitment Agency navigation to its own sidebar
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/v45-app.js';
          let text = fs.readFileSync(path, 'utf8');
          const start = text.indexOf('  function rebuildNav(){');
          const end = text.indexOf('\n\n  function pageMeta', start);
          if (start < 0 || end < 0) throw new Error('Could not isolate rebuildNav; refusing to patch');
          let fn = text.slice(start, end);
          const replacements = [
            ["document.querySelectorAll('[data-nav-toggle]').forEach", "target?.querySelectorAll('[data-nav-toggle]').forEach"],
            ["document.querySelectorAll('[data-page]').forEach", "target?.querySelectorAll('[data-page]').forEach"],
            ['document.querySelector(`[data-page=', 'target?.querySelector(`[data-page=']
          ];
          for (const [from, to] of replacements) {
            if (!fn.includes(from)) {
              if (!fn.includes(to)) throw new Error(`Expected selector not found in rebuildNav: ${from}`);
            } else {
              fn = fn.replace(from, to);
            }
          }
          text = text.slice(0, start) + fn + text.slice(end);
          fs.writeFileSync(path, text);
          NODE
      - name: Commit scoped navigation fix
        shell: bash
        run: |
          if git diff --quiet -- src/v45-app.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js
          git diff --cached --check
          git commit -m "fix: scope navigation bindings to Recruitment Agency [scope-nav-patched]"
          git push origin HEAD:diag/v4.7.2-live-click-path

name: v4.7.3 scoped navigation patch

on:
  push:
    branches:
      - diag/v4.7.2-live-click-path

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[scope-nav-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/v4.7.2-live-click-path
      - name: Scope Recruitment Agency navigation to its own sidebar
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/v45-app.js';
          let text = fs.readFileSync(path, 'utf8');
          const oldText = "function rebuildNav(){const target=document.getElementById('ra-nav');if(target)target.innerHTML=navHtml();document.querySelector('.ra-shell')?.classList.toggle('is-collapsed',!!state.settings.sidebarCollapsed);document.querySelectorAll('[data-nav-toggle]').forEach(button=>button.onclick=async()=>{const expanded=V46Navigation.toggleExpandedGroup(state.settings.navigation.expandedGroups,button.dataset.navToggle);await saveSettings({navigation:{...state.settings.navigation,expandedGroups:expanded}});rebuildNav();});document.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>route(btn.dataset.page).catch(e=>toast(e.message,true)));V46CompanyPlatform.syncNavigation?.();V47FactionPlatform.syncNavigation?.();document.querySelector(`[data-page=\"${state.page}\"]`)?.classList.add('active');}";
          const newText = "function rebuildNav(){const target=document.getElementById('ra-nav');if(target)target.innerHTML=navHtml();document.querySelector('.ra-shell')?.classList.toggle('is-collapsed',!!state.settings.sidebarCollapsed);target?.querySelectorAll('[data-nav-toggle]').forEach(button=>button.onclick=async()=>{const expanded=V46Navigation.toggleExpandedGroup(state.settings.navigation.expandedGroups,button.dataset.navToggle);await saveSettings({navigation:{...state.settings.navigation,expandedGroups:expanded}});rebuildNav();});target?.querySelectorAll('[data-page]').forEach(btn=>btn.onclick=()=>route(btn.dataset.page).catch(e=>toast(e.message,true)));V46CompanyPlatform.syncNavigation?.();V47FactionPlatform.syncNavigation?.();target?.querySelector(`[data-page=\"${state.page}\"]`)?.classList.add('active');}";
          if (!text.includes(oldText)) {
            throw new Error('Expected rebuildNav implementation was not found; refusing to patch');
          }
          text = text.replace(oldText, newText);
          fs.writeFileSync(path, text);
          NODE
      - name: Commit scoped navigation fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/v45-app.js
          git diff --cached --check
          git commit -m "fix: scope navigation bindings to Recruitment Agency [scope-nav-patched]"
          git push origin HEAD:diag/v4.7.2-live-click-path

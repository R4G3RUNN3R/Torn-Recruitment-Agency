name: v4.8.2 click geometry diagnostic

on:
  push:
    branches:
      - feature/v482-sort-filter-results
    paths:
      - .github/workflows/v482-click-diagnostic.yml

jobs:
  repeat-click-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Repeat physical-click regressions
        run: |
          for i in 1 2 3; do
            echo "CLICK DIAGNOSTIC RUN $i"
            node --test --test-concurrency=1 tests/v45-browser-hit-test.test.js tests/v45-browser-isolated-world.test.js
          done
